<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8" />
    <title>My ToDo List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #007bff;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            margin: 0;
            font-weight: normal;
        }
        header a.logout-btn {
            color: white;
            text-decoration: none;
            font-weight: bold;
            border: 2px solid white;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        header a.logout-btn:hover {
            background-color: white;
            color: #007bff;
        }
        main {
            max-width: 600px;
            margin: 2rem auto;
            background-color: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        ul.todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        ul.todo-list li {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            margin-bottom: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        ul.todo-list li.completed {
            text-decoration: line-through;
            color: #6c757d;
            background-color: #e9ecef;
        }
        .task-title {
            font-weight: bold;
        }
        .task-desc {
            font-size: 0.9rem;
            color: #555;
            margin-left: 1rem;
            flex-grow: 1;
        }
        .actions {
            display: flex;
            gap: 0.5rem;
        }
        button {
            cursor: pointer;
            border: none;
            border-radius: 4px;
            padding: 0.3rem 0.6rem;
            font-size: 0.85rem;
            transition: background-color 0.3s ease;
        }
        button.complete-btn {
            background-color: #28a745;
            color: white;
        }
        button.complete-btn:hover {
            background-color: #218838;
        }
        button.delete-btn {
            background-color: #dc3545;
            color: white;
        }
        button.delete-btn:hover {
            background-color: #c82333;
        }
        form.add-task {
            margin-top: 2rem;
            display: flex;
            gap: 0.5rem;
        }
        form.add-task input[type="text"] {
            flex-grow: 1;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 1rem;
        }
        form.add-task button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }
        form.add-task button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<header>
    <h1>Welcome, <span th:text="${#authentication.name}">User</span>!</h1>
    <form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>
</header>

<main>
    <h2>Your To-Do List</h2>

    <ul class="todo-list">
        <li th:each="todo : ${todos}" th:classappend="${todo.completed} ? 'completed'">
            <span class="task-title" th:text="${todo.title}">Sample Task</span>
            <span class="task-desc" th:text="${todo.description}">Description here</span>
            <div class="actions">
                <form th:action="@{/todos/{id}/complete(id=${todo.id})}" method="post" th:if="${!todo.completed}">
                    <button type="submit" class="complete-btn">Complete</button>
                </form>
                <form th:action="@{/todos/{id}/delete(id=${todo.id})}" method="post">
                    <button type="submit" class="delete-btn" onclick="return confirm('Delete this task?');">Delete</button>
                </form>
            </div>
        </li>
        <li th:if="${todos.isEmpty()}">
            <em>No tasks found. Add a new task below!</em>
        </li>
    </ul>

    <form class="add-task" th:action="@{/todos/add}" method="post">
        <input type="text" name="title" placeholder="New task title" required />
        <input type="text" name="description" placeholder="Description (optional)" />
        <button type="submit">Add Task</button>
    </form>
</main>

</body>
</html>
